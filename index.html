<!doctype html>
<meta charset="utf-8">
<title>GIF list</title>
<style>
  body { font-family: system-ui; margin: 1rem; }
  #tags button { margin: 2px; padding: 4px 10px; border-radius: 12px; border: 1px solid #888; cursor: pointer; }
  #tags button.on { background: #333; color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 1rem; }
  figure { margin: 0; } img { width: 100%; border-radius: 8px; }
</style>
<input id="q" placeholder="Search…">
<div id="tags"></div>
<div id="grid"></div>
<script>
let all = [], active = new Set();
const grid = document.getElementById('grid'), q = document.getElementById('q');

function render() {
  const term = q.value.toLowerCase();
  grid.innerHTML = '';
  all.filter(g =>
    g.title.toLowerCase().includes(term) &&
    [...active].every(t => g.tags.includes(t))
  ).forEach(g => {
    grid.insertAdjacentHTML('beforeend',
      `<figure><img loading="lazy" src="${g.url}" alt="${g.title}"><figcaption>${g.title}</figcaption></figure>`);
  });
}

fetch('gifs.json').then(r => r.json()).then(data => {
  all = data;
  const tags = [...new Set(data.flatMap(g => g.tags))].sort();
  const box = document.getElementById('tags');
  tags.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    b.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); b.classList.toggle('on'); render(); };
    box.appendChild(b);
  });
  render();
});
q.oninput = render;
</script>
