<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF list</title>
<style>
  body { font-family: system-ui; margin: 1rem; }
  #tags button, #export { margin: 2px; padding: 4px 10px; border-radius: 12px; border: 1px solid #888; cursor: pointer; }
  #tags button.on { background: #333; color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 1rem; }
  figure { margin: 0; } img { width: 100%; border-radius: 8px; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; margin: 2px 2px 0 0; border-radius: 10px; background: #ddd; color: #222; }
  .chip b { cursor: pointer; margin-left: 4px; }
  select { margin-top: 4px; }
</style>
<input id="q" placeholder="Search…">
<button id="export">Copy JSON</button>
<div id="tags"></div>
<div id="grid"></div>
<script>
const KEY = 'gif-tags';
let all = [], active = new Set();
const grid = document.getElementById('grid'), q = document.getElementById('q'), box = document.getElementById('tags');

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allTags = () => [...new Set(all.flatMap(g => g.tags))].sort();

function loadSaved() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(all.map(g => [g.url, g.tags])))); } catch (e) {}
}

function renderTags() {
  box.innerHTML = '';
  const tags = allTags();
  active.forEach(t => { if (!tags.includes(t)) active.delete(t); });
  tags.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    if (active.has(t)) b.classList.add('on');
    b.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); renderTags(); render(); };
    box.appendChild(b);
  });
}

function render() {
  const term = q.value.toLowerCase();
  const tags = allTags();
  grid.innerHTML = '';
  all.forEach((g, i) => {
    if (!g.title.toLowerCase().includes(term)) return;
    if (![...active].every(t => g.tags.includes(t))) return;
    const chips = g.tags.map(t => `<span class="chip">${esc(t)}<b data-i="${i}" data-t="${esc(t)}">×</b></span>`).join('');
    const opts = tags.filter(t => !g.tags.includes(t)).map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
